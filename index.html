<!doctype html>
<!--
  MY UNIVERSE: a personal site where each section is a glowing 3D sphere.

  Project layout:
    index.html        page structure (this file)
    css/style.css     all styling
    js/content.js     YOUR CONTENT: sections, cards, notes   ← edit this most
    js/config.js      tuning knobs for the 3D scene
    js/state.js       shared values that change while the page runs
    js/panel.js       menu, content panel, cards, popup
    js/scene.js       the three.js scene and its animation loop
    js/input.js       mouse: hover, click, drag-to-spin
    js/main.js        starts everything
    images/           posters

  Run locally (images and modules need a server, not file://):
    python3 -m http.server 8765      then open http://localhost:8765
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="My Universe: a personal site where each section is a glowing 3D sphere.">
  <meta name="theme-color" content="#0b0d17">
  <title>feranno liu</title>
  <!-- Tab icon: the Crossing FL mark on a transparent square, so it sits on
       the browser's own tab color. The SVG switches between near-black and
       white with the browser's light/dark theme; the PNG (near-black) is for
       browsers that don't use SVG tab icons. The home-screen icon keeps a
       navy background, because phones put it on a wallpaper. -->
  <link rel="icon" type="image/png" sizes="192x192" href="images/fl-favicon.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="images/fl-favicon.svg">
  <link rel="apple-touch-icon" href="images/fl-icon.png">

  <!-- Fonts: connect early, then load -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=Spectral:ital,wght@0,400;1,400&display=swap">

  <link rel="stylesheet" href="css/style.css?v=2026-11-28zd">

  <!-- The site always opens in midnight (dark); the light switch lasts for
       the visit only. js/theme.js. -->

  <!-- Where imports download from.
       "three" is pinned, so it never changes under you.
       Our own files carry ?v=: browsers keep JS for ~10 minutes, so after an
       update, change the version here (and on style.css above) to make every
       visitor fetch the new files at once instead of mixing old and new. -->
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "./js/main.js": "./js/main.js?v=2026-11-28zd",
      "./js/panel.js": "./js/panel.js?v=2026-11-28zd",
      "./js/scene.js": "./js/scene.js?v=2026-11-28zd",
      "./js/input.js": "./js/input.js?v=2026-11-28zd",
      "./js/audio.js": "./js/audio.js?v=2026-11-28zd",
      "./js/chopin.js": "./js/chopin.js?v=2026-11-28zd",
      "./js/config.js": "./js/config.js?v=2026-11-28zd",
      "./js/content.js": "./js/content.js?v=2026-11-28zd",
      "./js/state.js": "./js/state.js?v=2026-11-28zd",
      "./js/theme.js": "./js/theme.js?v=2026-11-28zd",
      "./js/sap1.js": "./js/sap1.js?v=2026-11-28zd",
      "./js/lists.js": "./js/lists.js?v=2026-11-28zd",
      "./js/sap1-timeline.js": "./js/sap1-timeline.js?v=2026-11-28zd"
    } }
  </script>
  <!-- Modules wait for the page to finish loading, so this is safe in <head> -->
  <script type="module" src="js/main.js?v=2026-11-28zd"></script>
  <!-- Opened straight from disk (file://), browsers refuse to run the modules
       above. If they didn't start, load js/bundle.js instead: the same code in
       one plain script. Rebuild it after editing js/: sh tools/build-file-bundle.sh -->
  <script>
    if (location.protocol === "file:") addEventListener("load", () => {
      if (document.documentElement.dataset.started) return;   // this browser ran the modules after all
      const fallback = document.createElement("script");
      fallback.src = "js/bundle.js?v=2026-11-28zd";
      document.head.appendChild(fallback);
    });
  </script>
</head>

<body>

  <!-- Site title, top-left -->
  <header>
    <!-- Signature mark, "Crossing": an upright F and L. The F's middle arm
         crosses the L's stem and forms a small Latin cross (12 either side,
         12 above, 22 below); the arm is drawn last, so the cross appears at
         the end. It draws itself on load and takes the text color, so it
         follows the midnight/light switch. Styles: css/style.css,
         "Signature mark". Alternates (Trace, Hairline): practice/logos/. -->
    <svg class="mark" viewBox="0 0 96 48" aria-hidden="true">
      <path pathLength="1" d="M6 42V8H13"/>
      <path pathLength="1" d="M18 8V42H90"/>
      <path pathLength="1" d="M6 20H30"/>
    </svg>
    <!-- The mark spells F and L, so the name is not shown again. It stays in
         the page as the main heading for screen readers and search engines. -->
    <h1 class="visually-hidden">Feranno Liu</h1>
    <!-- Set like a dictionary entry: headword, pronunciation, part of speech, sense -->
    <!-- <p class="motto"><span class="motto-word">Thauma</span> <span class="motto-quiet">(θαῦμα)</span> <i class="motto-quiet">n.</i> wonder</p> -->
  </header>

  <!-- Switches between midnight (dark) and light, top-right. See js/theme.js.
       Its label names the mode it switches TO. The music player, bottom-right, is
       built by js/audio.js. -->
  <button type="button" id="theme-toggle">☀ light</button>

  <!-- Menu, bottom-left. Buttons are generated from js/content.js -->
  <nav aria-label="Sections"></nav>

  <!-- Content panel. Hidden on the home view; filled in by openSection() -->
  <main hidden>
    <button type="button" class="back">← back</button>
    <h2 id="section-title"></h2>
    <div id="section-blurb"></div>
    <!-- Filter tabs for sections with `tabs` (e.g. projects: 1D 2D 3D 4D) -->
    <div id="tabs" role="group" aria-label="Filter" hidden></div>
    <!-- Written text for sections with a `body` (e.g. about) -->
    <div class="prose" id="prose" hidden></div>
    <div class="grid" id="cards"></div>
  </main>

  <!-- Card detail view: full poster on the left, title and notes on the right.
       Covers the whole screen. Filled in by openPopup() -->
  <dialog id="popup" aria-labelledby="popup-title">
    <button type="button" id="popup-close" class="back detail-back">← back</button>
    <!-- Two equal columns: the poster centered on the left, the text on the right -->
    <div class="detail">
      <div class="detail-poster">
        <img id="popup-img" class="detail-media" alt="">
        <!-- Projects show a video here instead. It loads only when opened.
             The frame holds the video and, for SAP-1, the boxes drawn over it
             (js/sap1.js); the clock stepper goes underneath. -->
        <div class="video-frame" id="popup-frame" hidden>
          <video id="popup-video" class="detail-media" muted loop playsinline controls preload="none" hidden></video>
          <svg id="popup-overlay" class="sap-overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <div id="popup-diagram" class="sap" hidden></div>
      </div>
      <div class="detail-text">
        <h3 id="popup-title"></h3>
        <p id="popup-subtitle" class="detail-subtitle" hidden></p>
        <p id="popup-note"></p>
        <dl id="popup-facts" class="detail-facts" hidden></dl>
        <ul id="popup-gallery" class="detail-gallery" hidden></ul>
      </div>
    </div>
  </dialog>

  <!-- One gallery image at full size, above the detail view -->
  <dialog id="lightbox" aria-label="Enlarged image">
    <button type="button" id="lightbox-close" class="back detail-back">← back</button>
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </dialog>

  <noscript>
    <p class="noscript">This site needs JavaScript to show its sections.</p>
  </noscript>

</body>

</html>

<!-- FL mark, "Trace" (kept alternate). The F on its side and the flipped L,
     routed like a circuit-board wire: 45° corners and a via at each end.
     The vias fill with the page color, so set fill: var(--bg) on .via. -->
<svg class="mark" viewBox="0 0 96 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true">
  <path pathLength="1" d="M6 6V36L12 42H64"/>
  <path pathLength="1" d="M34 42V30"/>
  <path pathLength="1" d="M34 6H84L90 12V30"/>
  <circle class="via" cx="6" cy="6" r="2.4" stroke-width="1.4"/>
  <circle class="via" cx="90" cy="30" r="2.4" stroke-width="1.4"/>
</svg>

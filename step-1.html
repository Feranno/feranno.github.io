<!doctype html>
<!--
  ███ STEP 1 · HTML: the skeleton ███

  A website is just TEXT FILES that a browser reads. There are 3 languages:
    HTML        = WHAT is on the page   (this step)
    CSS         = HOW it looks          (step 2)
    JavaScript  = WHAT it does          (step 3)

  HTML is made of TAGS. A tag looks like <name> ... </name>.
    <p>Hello</p>        "p" means paragraph. <p> opens it, </p> closes it.
    Tags go inside tags, like boxes in boxes. That nesting is the whole idea.
  Some tags have ATTRIBUTES, extra info written inside the opening tag:
    <html lang="en">    attribute "lang" with value "en"

  Anything between and --> <!-- (like this text) is a COMMENT.
  The browser ignores it. It's a note for humans.

  Try it: change some text below, save, and reload the page.
-->

<!-- The first line above, <!doctype html>, tells the browser "this is modern HTML". -->

<!-- <html> is the outermost box. Everything else goes inside it. -->
<html lang="en">

<!-- <head> holds info ABOUT the page. Nothing in here is shown on the page itself. -->

<head>
  <!-- Which alphabet the file uses. utf-8 covers every language and emoji. -->
  <meta charset="utf-8">
  <!-- The text shown on the browser tab. -->
  <title>My Universe</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap">
  <style>
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    header,
    nav,
    main {
      z-index: 1;
    }

    main {
      position: relative;
    }

    /* z-index only works on positioned elements */

    body {
      background: #0b0d17;
      color: white;
    }

    main {
      margin-left: clamp(280px, 45%, 50%);
      padding: 120px 48px 80px 0;
    }

    /* 4 values = top right bottom left (clockwise) */
    header {
      position: fixed;
      top: 24px;
      left: 24px;
    }

    nav {
      position: fixed;
      bottom: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    nav button {
      text-shadow: 0 0 8px #0b0d17;
    }

    nav button {
      background: none;
      border: none;
      color: #8a8fa8;
      font: inherit;
      cursor: pointer;
    }

    nav button.active {
      color: white;
    }

    /* button AND .active, with no space = both at once */
    nav button.active::before {
      content: "● ";
      color: var(--accent);
    }

    /* ::before inserts content before the text */

    nav button:hover {
      color: white;
    }

    .card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* overflow: hidden = crop anything sticking out */
    .card img {
      position: absolute;
      inset: 0;
      /* inset: 0 = stretch to all four edges of the card */
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* fill the box and crop the extra, instead of squashing the image */
      transition: transform 0.5s, filter 0.5s;
    }

    .card span {
      position: relative;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    /* stays on top of the image, readable on any picture */
    .card:hover img {
      transform: scale(1.1);
      filter: brightness(1.2);
    }

    /* zoom and brighten inside the cropped frame */

    .card {
      aspect-ratio: 3 / 4;
      /* poster shape: height follows width */
      display: flex;
      align-items: flex-end;
      /* push the title to the bottom */
      padding: 12px;
      border-radius: 10px;
      background: linear-gradient(160deg, var(--accent, #34d399), #0b0d17);
      transition: transform 0.2s;
      /* animate any change to transform */
    }

    .card:hover {
      transform: scale(1.08);
    }

    /* :hover = "while the mouse is over it" */

    .grid {
      display: grid;
      /* grid-template-columns: repeat(3, 1fr); */
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min, 160px), 1fr));
      gap: 12px;
    }

    body {
      font-family: "Inter", sans-serif;
    }

    /* merge this into your existing body rule */
    h1,
    h2 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
    }

    h2 {
      font-size: 64px;
      margin: 0 0 8px;
    }

    #popup {
      padding: 0;
      border: none;
      border-radius: 16px;
      background: #141829;
      color: white;
      width: min(420px, 90vw);
      overflow: hidden;
    }

    /* min() = whichever is smaller. 90vw = 90% of the window width */
    #popup::backdrop {
      background: rgba(5, 6, 12, 0.6);
      backdrop-filter: blur(6px);
    }

    /* the dimmed, blurred page behind it */
    #popup img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      vertical-align: top;
    }

    .popup-body {
      padding: 20px 24px 24px;
    }

    #popup h3 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: 32px;
      margin: 0 0 8px;
    }

    #popup p {
      color: #b8bccf;
      line-height: 1.6;
    }

    #popup-close {
      background: none;
      border: 1px solid #3a3f5c;
      color: white;
      border-radius: 999px;
      padding: 6px 16px;
      font: inherit;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      main {
        margin-left: 0;
        padding: 140px 16px 80px;
      }
    }
  </style>
</head>

<!-- <body> holds everything you SEE. -->

<body>

  <!-- <header> is a box for the top of a page. The browser doesn't style it specially;
         the name just describes what's inside. -->
  <header>
    <!-- h1 = "heading level 1", the biggest title. There's also h2, h3 ... h6. -->
    <h1>My Universe</h1>
    <!-- p = paragraph of text. -->
    <p>A personal site. Six sections, one per sphere.</p>
  </header>

  <!-- <nav> = a box for navigation (the menu). -->
  <nav>
    <!-- <button> = something clickable. These do nothing yet; JavaScript will
           make them work in step 3. -->
  </nav>

  <!-- <main> = the main content of the page. For now it shows one section by hand. -->
  <main hidden>
    <button class="back">← back</button>
    <!-- h2 = a slightly smaller heading than h1. -->

    <h2>anime</h2>
    <p>Shows I love.</p>

    <!-- <div> = "division", a plain box with no meaning. We use it to group things.
           class="grid" is a LABEL. It does nothing by itself, but in step 2
           CSS will say "anything labeled grid, lay it out as a grid". -->
    <div class="grid">
    </div>

  </main>

  <dialog id="popup">
    <img id="popup-img" alt="">
    <div class="popup-body">
      <h3 id="popup-title"></h3>
      <p id="popup-note"></p>
      <button id="popup-close">close</button>
    </div>
  </dialog>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from "three";

    const sections = [
      { name: "about", radius: 3.2, color: "#7dd3fc", blurb: "loading...", items: [] },
      { name: "projects", radius: 2.2, color: "#a78bfa", blurb: "beepboop", items: [] },
      { name: "notes", radius: 1.5, color: "#f472b6", blurb: "brrr", items: [] },
      { name: "sports", radius: 1.0, color: "#fbbf24", blurb: "aesthetic", items: [] },
      {
        name: "anime", radius: 0.6, color: "#34d399", blurb: "Shows I love.", items: [{ title: "Frieren", image: "images/frieren.jpg", note: "beyond journey's end" },
        { title: "Mob Psycho 100", image: "images/mob-psycho-100.jpg" }, { title: "Cowboy Bebop", image: "images/cowboy-bebop.jpg" },
        { title: "Mushishi", image: "images/mushishi.jpg" }, { title: "Ping Pong the Animation", image: "images/ping-pong-the-animation.jpg" },
        { title: "Vinland Saga", image: "images/vinland-saga.jpg" }, { title: "Made in Abyss", image: "images/made-in-abyss.jpg" },
        { title: "Showa Genroku Rakugo Shinju", image: "images/showa-genroku-rakugo-shinju.jpg" }, { title: "Orb", image: "images/orb.jpg" },
        { title: "Attack on Titan", image: "images/attack-on-titan.jpg" }]
      },
      { name: "movies", radius: 0.3, color: "#f87171", blurb: "Movies I love.", items: [] },
    ];

    const nav = document.querySelector("nav");          // find the first <nav> (same selectors as CSS!)

    //
    let current = null;                                  // which section is open. null = home
    const main = document.querySelector("main");

    const popup = document.querySelector("#popup");

    function openPopup(item) {
      popup.querySelector("#popup-title").textContent = item.title;
      popup.querySelector("#popup-note").textContent = item.note ?? "";  // ?? "" = use empty text if there's no note
      const img = popup.querySelector("#popup-img");
      img.hidden = !item.image;                       // ! = "not": hide the image if this item doesn't have one
      if (item.image) { img.src = item.image; img.alt = item.title; }
      popup.showModal();                              // open it: centered, on top of everything, with the rest of the page blocked
    }
    document.querySelector("#popup-close").addEventListener("click", () => popup.close());
    popup.addEventListener("click", (e) => { if (e.target === popup) popup.close(); }); // clicked the dark area outside → close

    function openSection(section) {
      current = section;
      main.hidden = false;
      document.querySelector("h2").textContent = section.name;
      document.querySelector("main p").textContent = section.blurb;
      document.body.style.setProperty("--accent", section.color);

      const grid = document.querySelector(".grid");
      grid.replaceChildren();                          // remove every old card
      /*
      section.items.forEach((item, i) => {             // like for…of, but also gives the position i (0, 1, 2…)
        const card = document.createElement("div");
        card.animate(
          [{ opacity: 0, transform: "translateY(16px)" },   // keyframe 1: invisible, 16px lower
          { opacity: 1, transform: "none" }],               // keyframe 2: visible, in place
          { duration: 500, delay: 200 + i * 50, easing: "ease-out", fill: "backwards" }
        );
        card.className = "card";                       // same as writing class="card" in HTML
        card.textContent = item;                       // textContent, not innerHTML (remember XSS)
        grid.appendChild(card);
      }); */

      section.items.forEach((raw, i) => {
        const item = typeof raw === "string" ? { title: raw } : raw;  // typeof tells you what KIND of value: "string", "object"…
        // turn plain text into an object so the rest of the code
        // only has to handle one shape ("normalizing")
        const card = document.createElement("div");
        card.className = "card";

        if (item.image) {                               // only if this item has a picture
          const img = document.createElement("img");    // <img> = an image tag
          img.src = item.image;                         // src = which file to show
          img.alt = item.title;                         // alt = description for screen readers, or if the file fails to load
          img.loading = "lazy";                         // don't download it until it's about to be visible
          card.appendChild(img);
        }

        const label = document.createElement("span");  // span = a small inline box for text
        label.textContent = item.title;
        card.appendChild(label);

        card.addEventListener("click", () => openPopup(item));  // each card opens a popup with ITS item (a closure again)
        grid.appendChild(card);
        card.animate(
          [{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }],
          { duration: 500, delay: 200 + i * 50, easing: "ease-out", fill: "backwards" }
        );
      });

      main.animate(
        [{ opacity: 0, transform: "translateX(24px)" }, { opacity: 1, transform: "none" }],
        { duration: 600, easing: "ease-out" }
      );
      for (const s of sections) s.button.classList.toggle("active", s === section);  // add the class if true, remove it if false
    }
    function goHome() {
      current = null;
      main.hidden = true;
      for (const s of sections) s.button.classList.remove("active");
    }

    // 2. clicking a sphere
    document.querySelector(".back").addEventListener("click", goHome);
    addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (popup.open) return;      // a popup is open: let the dialog handle Escape on its own
      goHome();
    });

    for (const section of sections) {
      const button = document.createElement("button");
      button.section = section;
      section.button = button;
      button.textContent = section.name;

      // 1. clicking a nav button
      button.addEventListener("click", () => openSection(section));
      nav.appendChild(button);
    }

    // SCENE, CAMERA, RENDERER
    const scene = new THREE.Scene();                     // the 3D world: an empty container for objects
    const camera = new THREE.PerspectiveCamera(
      50,                                                // field of view in degrees (zoom of the lens)
      innerWidth / innerHeight,                          // aspect ratio = window width / height
      0.1, 100                                           // near and far: only draw things between these distances
    );
    camera.position.z = 10;                              // step back 10 units so we can see the origin (0,0,0)

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // draws with the GPU; alpha = transparent background
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); // sharp on retina screens, capped for speed
    renderer.setSize(innerWidth, innerHeight);           // fill the window
    document.body.prepend(renderer.domElement);          // renderer made a <canvas>; put it first in the body

    // a sphere = shape + skin
    /*
    const geometry = new THREE.SphereGeometry(3, 32, 32);  // radius 3, 32 slices around, 32 rings top-to-bottom
    const material = new THREE.MeshBasicMaterial({ color: "#7dd3fc", wireframe: true }); // draw only the edges
    const sphere = new THREE.Mesh(geometry, material);   // mesh = geometry + material = a visible object
    scene.add(sphere);                                     // nothing is drawn unless it's in the scene
    */

    // WORLD, SPHERE LOOP, LIGHTS

    //Generate spheres from your data
    const world = new THREE.Group();      // an invisible container; rotate it and everything inside rotates
    scene.add(world);
    let hovered = null;                   // which section the mouse is over (null = none). `let` = can change later

    for (const section of sections) {     // same loop pattern as your buttons!
      const segments = Math.round(12 + section.radius * 8);   // big spheres get more lines, small ones fewer

      const glow = new THREE.Mesh(                            // a soft, see-through colored shell
        new THREE.SphereGeometry(section.radius, 64, 64),
        new THREE.MeshStandardMaterial({
          color: section.color, emissive: section.color, emissiveIntensity: 0.4, // emissive = glows on its own
          transparent: true, opacity: 0.06,
          side: THREE.DoubleSide,         // draw the inside surface too (we'll fly inside later)
          depthWrite: false,              // see explanation below
        })
      );
      const wire = new THREE.Mesh(                            // the line pattern on top
        new THREE.SphereGeometry(section.radius, segments, segments),
        new THREE.MeshBasicMaterial({ color: section.color, wireframe: true, transparent: true, opacity: 0.25, depthWrite: false })
      );
      glow.renderOrder = wire.renderOrder = -section.radius;  // draw big spheres first, small ones last

      world.add(glow, wire);
      section.glow = glow;                // store the meshes ON the data object so the loop can find them
      section.wire = wire;
      section.offset = Math.random() * 10; // a random number so the spheres don't all breathe in sync
    }

    // Hover: which sphere is the mouse over?
    const raycaster = new THREE.Raycaster();       // shoots a line from the camera through the mouse into the 3D world
    const pointer = new THREE.Vector2();           // mouse position, measured the way three.js expects
    const center = new THREE.Vector3(0, 0, 0);
    const smallestFirst = [...sections].sort((a, b) => a.radius - b.radius); // a copy, sorted by size

    function sectionAt(event) {
      pointer.x = (event.clientX / innerWidth) * 2 - 1;      // pixels → -1 (left edge) to +1 (right edge)
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;    // pixels → +1 (top) to -1 (bottom). Screen y points down, 3D y points up
      raycaster.setFromCamera(pointer, camera);
      const d = raycaster.ray.distanceToPoint(center);       // how close the line passes to the center
      return smallestFirst.find((s) => s.radius >= d) ?? null; // smallest sphere the line passes inside. ?? null = "or nothing"
    }

    //click vs drag
    addEventListener("pointerdown", (e) => {
      if (e.target.closest("button, .card, dialog")) return;
      dragging = true;
      dragMoved = 0;
    });
    addEventListener("pointerup", () => { dragging = false; });

    addEventListener("pointermove", (e) => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;
      if (dragging) {
        spin.y += e.movementX * 0.005;                  // movementX = pixels moved since the last event
        spin.x += e.movementY * 0.005;
        dragMoved += Math.abs(e.movementX) + Math.abs(e.movementY); // abs = drop the minus sign
      }
      const navButton = e.target.closest("nav button");
      if (navButton) hovered = navButton.section;              // hovering a menu item lights up its sphere
      else hovered = e.target.closest("button, .card, dialog") ? null : sectionAt(e);
      document.body.style.cursor = hovered ? "pointer" : "";
    });

    addEventListener("click", (e) => {
      if (e.target.closest("button, .card, dialog")) return;
      if (dragMoved > 5) return;                        // it was a drag, not a click
      const s = sectionAt(e);
      if (!s || s === current) goHome();                // empty space, or the open sphere again → home
      else openSection(s);
    });



    // update the loop: spin the loop, breathe, react to hover
    const clock = new THREE.Clock();
    function loop() {
      const dt = clock.getDelta();
      const t = clock.elapsedTime;
      world.rotation.y = 0.1 * t + spin.y;                      // rotate the container, not each sphere
      world.rotation.x = 0.05 * t + spin.x;

      for (const s of sections) {
        const breathe = 1 + 0.008 * Math.sin(2 * t + s.offset); // sin swings between -1 and 1 → scale swings 0.992 to 1.008
        s.glow.scale.setScalar(breathe);                         // setScalar = same scale on x, y and z
        s.wire.scale.setScalar(breathe);

        const hot = s === hovered;                               // === means "is exactly the same thing". true or false
        s.wire.material.color.set(hot ? "#ffffff" : s.color);    // condition ? ifTrue : ifFalse
        s.wire.material.opacity = hot ? 0.9 : 0.25;
        s.glow.material.opacity = hot ? 0.15 : 0.06;
        s.glow.material.emissiveIntensity = hot ? 1.5 + 0.3 * Math.sin(10 * t) : 0.4; // fast pulse while hovered
      }

      // rings and sparks
      for (const ring of rings) ring.rotation.z = t * ring.userData.speed;  // spin each ring in its own tilted plane

      sparks.visible = hovered !== null;                       // !== means "is not". Show sparks only while hovering
      if (hovered) {
        sparks.material.color.set(hovered.color);
        for (let i = 0; i < SPARKS; i++) {
          const p = sparkData[i];
          const dist = hovered.radius + ((t * p.speed + p.offset) % 0.6); // % = remainder: counts up to 0.6, then snaps to 0
          sparkPositions[i * 3] = p.dir.x * dist;          // position = direction × distance
          sparkPositions[i * 3 + 1] = p.dir.y * dist;
          sparkPositions[i * 3 + 2] = p.dir.z * dist;
        }
        sparkGeometry.attributes.position.needsUpdate = true;  // "the numbers changed, send them to the GPU again"
      }
      updateCamera(dt);                                        // step 4

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    // Light
    scene.add(new THREE.AmbientLight("#ffffff", 0.6));           // soft light from everywhere
    const light = new THREE.PointLight("#ffffff", 1.5, 0, 0);    // a bulb: color, brightness, range (0 = infinite), fade (0 = none)
    light.position.set(10, 10, 10);                              // up, right, toward you
    scene.add(light);

    //Drag to spin
    const spin = { x: 0, y: 0 };      // extra rotation from dragging
    let dragging = false;
    let dragMoved = 0;                // how many pixels the mouse moved during this press

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();          // camera settings are cached; tell it to recalculate
      renderer.setSize(innerWidth, innerHeight);
    });

    // dot texture
    function makeDotTexture() {
      const c = document.createElement("canvas");   // an off-screen canvas, never added to the page
      c.width = c.height = 64;                      // 64×64 pixels is plenty for a dot
      const g = c.getContext("2d");                 // the 2D paintbrush, like in Dodge
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32); // fade from the center (radius 0) to the edge (radius 32)
      grad.addColorStop(0, "rgba(255,255,255,1)");   // center: solid white
      grad.addColorStop(0.3, "rgba(255,255,255,0.8)");
      grad.addColorStop(1, "rgba(255,255,255,0)");   // edge: fully transparent
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);            // turn the picture into something the GPU can use
    }
    const dotTexture = makeDotTexture();

    // ORBIT RINGS: 5 dots in a circular ring
    const dots = new Float32Array(100 * 3);          // a fast list of plain numbers: x,y,z, x,y,z, … for 100 dots
    for (let i = 0; i < 100; i++) {                  // classic loop: i counts 0, 1, 2 … 99
      const angle = (i / 100) * Math.PI * 2;         // spread the dots evenly around a full circle (2π radians)
      dots[i * 3] = 4 * Math.cos(angle);         // x  ┐ cos and sin of an angle give a point on a circle.
      dots[i * 3 + 1] = 4 * Math.sin(angle);         // y  ┘ Multiply by 4 = radius 4, just outside the biggest sphere
      dots[i * 3 + 2] = 0;                           // z: flat
    }
    const ringGeometry = new THREE.BufferGeometry(); // geometry from raw points instead of a ready-made shape
    ringGeometry.setAttribute("position", new THREE.BufferAttribute(dots, 3)); // "read these numbers 3 at a time as positions"

    const haloDot = new THREE.PointsMaterial({ size: 0.3, map: dotTexture, color: "#ffffff", transparent: true, opacity: 0.15, depthWrite: false });
    const coreDot = new THREE.PointsMaterial({ size: 0.08, map: dotTexture, color: "#ffffff", transparent: true, opacity: 0.9, depthWrite: false });

    const tilts = [0, 30, 60, 120, 150];             // degrees. 90 is skipped (it would be seen edge-on as a line)
    const rings = [];
    for (let i = 0; i < tilts.length; i++) {
      const ring = new THREE.Group();
      ring.add(new THREE.Points(ringGeometry, haloDot));   // big, faint dots ┐ drawn on the same spot =
      ring.add(new THREE.Points(ringGeometry, coreDot));   // small, bright   ┘ a fake "glow" for free
      ring.rotation.x = THREE.MathUtils.degToRad(tilts[i]); // tilt the whole ring
      ring.userData.speed = 0.1 + 0.02 * i;                 // userData = a spot for your own data. Each ring is a bit faster
      world.add(ring);
      rings.push(ring);                                     // push = add to the end of an array
    }

    //SPARKS
    const SPARKS = 150;                               // ALL_CAPS = a convention for "this number never changes"
    const sparkData = [];
    for (let i = 0; i < SPARKS; i++) {
      const theta = Math.random() * Math.PI * 2;      // random angle around the equator
      const phi = Math.acos(2 * Math.random() - 1);   // random angle from the north pole (see note below)
      sparkData.push({
        dir: new THREE.Vector3().setFromSphericalCoords(1, phi, theta), // a direction: an arrow of length 1
        speed: 0.1 + 0.1 * Math.random(),
        offset: Math.random() * 100,                  // so they don't all start together
      });
    }
    const sparkPositions = new Float32Array(SPARKS * 3);
    const sparkGeometry = new THREE.BufferGeometry();
    sparkGeometry.setAttribute("position", new THREE.BufferAttribute(sparkPositions, 3));
    const sparks = new THREE.Points(sparkGeometry, new THREE.PointsMaterial({
      size: 0.12, map: dotTexture, transparent: true, opacity: 0.9, depthWrite: false,
      blending: THREE.AdditiveBlending,               // add colors on top of what's behind, so overlaps get brighter, like light
    }));
    sparks.frustumCulled = false;                     // see note below
    world.add(sparks);

    // The loop: real time steps, plus rings and sparks

    // CAMERA
    const mouse = { x: 0, y: 0 };
    const camGoal = new THREE.Vector3(0, 0, 10);    // where the camera wants to BE
    const lookGoal = new THREE.Vector3();           // where it wants to LOOK
    const look = new THREE.Vector3();               // where it's looking right now

    function updateCamera(dt) {
      if (current) {
        const distance = current.radius * 3.2 + 1.5;                  // small sphere → fly in close
        const halfWidth = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * distance * camera.aspect; // how wide the view is at that distance
        const shift = camera.aspect > 1 ? halfWidth * 0.5 : 0;        // on a wide screen, slide right so the sphere sits in the LEFT half
        camGoal.set(shift, 0, distance);
        lookGoal.set(shift, 0, 0);
      } else {
        camGoal.set(0, 0, 10);
        lookGoal.set(mouse.x * 0.5, mouse.y * 0.5, 0);                // home: lean slightly toward the mouse
      }
      const k = 1 - Math.exp(-3 * dt);              // fraction of the remaining distance to move this frame
      camera.position.lerp(camGoal, k);             // lerp = move part of the way toward a target
      look.lerp(lookGoal, k);
      camera.lookAt(look);
    }

    loop();
  </script>

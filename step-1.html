<!doctype html>
<!--
  MY UNIVERSE: a personal site where each section is a glowing 3D sphere.

  How it's built:
    HTML (body)   the page structure: header, menu, content panel, popup
    CSS  (style)  how everything looks
    JS   (script) the data, the 3D scene (three.js), and all interaction

  Run it through a local server so images load:
    cd ~/Documents/Claude/spheres && python3 -m http.server 8765
    then open http://localhost:8765/step-1.html

  To add content, edit the SECTIONS list at the top of the script.
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>My Universe</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap">

  <style>
    /* ============================================================
       1. COLORS & FONTS: change the look in one place
       ============================================================ */
    :root {
      --bg: #0b0d17;          /* page background (deep navy) */
      --panel: #141829;       /* popup background */
      --muted: #8a8fa8;       /* secondary text */
      --line: #3a3f5c;        /* thin borders */
      --font-body: "Inter", sans-serif;
      --font-display: "Instrument Serif", serif;
      /* --accent is set by JavaScript to the open section's color */
    }

    body {
      background: var(--bg);
      color: white;
      font-family: var(--font-body);
    }

    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 400;
    }

    /* ============================================================
       2. LAYERS: the 3D canvas sits behind everything
       ============================================================ */
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    header, nav, main {
      z-index: 1;              /* above the canvas (z-index needs a position set) */
    }

    /* ============================================================
       3. HEADER & MENU: pinned to the corners of the screen
       ============================================================ */
    header {
      position: fixed;
      top: 24px;
      left: 24px;
    }

    nav {
      position: fixed;
      bottom: 24px;
      left: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    nav button {
      background: none;
      border: none;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      text-shadow: 0 0 8px var(--bg);   /* keeps text readable over the spheres */
    }

    nav button:hover,
    nav button.active {
      color: white;
    }

    nav button.active::before {         /* a colored dot before the open section */
      content: "● ";
      color: var(--accent);
    }

    /* ============================================================
       4. CONTENT PANEL: the right side of the screen
       ============================================================ */
    main {
      position: relative;
      margin-left: clamp(280px, 45%, 50%);   /* 45% of the width, kept between 280px and 50% */
      padding: 120px 48px 80px 0;            /* top right bottom left */
    }

    h2 {
      font-size: 64px;
      margin: 0 0 8px;
    }

    /* ============================================================
       5. CARDS: a responsive grid of posters
       ============================================================ */
    .grid {
      display: grid;
      /* as many columns as fit, each at least --card-min wide */
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min, 160px), 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      aspect-ratio: 3 / 4;               /* poster shape */
      display: flex;
      align-items: flex-end;             /* title sits at the bottom */
      padding: 12px;
      border-radius: 10px;
      overflow: hidden;                  /* crop the image to the rounded corners */
      cursor: pointer;
      background: linear-gradient(160deg, var(--accent, #34d399), var(--bg));
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.08);
    }

    .card img {
      position: absolute;
      inset: 0;                          /* stretch to all four edges */
      width: 100%;
      height: 100%;
      object-fit: cover;                 /* fill and crop, never squash */
      transition: transform 0.5s, filter 0.5s;
    }

    .card:hover img {
      transform: scale(1.1);
      filter: brightness(1.2);
    }

    .card span {
      position: relative;                /* above the image */
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
    }

    /* ============================================================
       6. POPUP: details for one card
       ============================================================ */
    #popup {
      padding: 0;                        /* so only clicks OUTSIDE hit the dialog itself */
      border: none;
      border-radius: 16px;
      background: var(--panel);
      color: white;
      width: min(420px, 90vw);
      overflow: hidden;
    }

    #popup::backdrop {
      background: rgba(5, 6, 12, 0.6);
      backdrop-filter: blur(6px);
    }

    #popup img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      vertical-align: top;
    }

    .popup-body {
      padding: 20px 24px 24px;
    }

    #popup h3 {
      font-size: 32px;
      margin: 0 0 8px;
    }

    #popup p {
      color: #b8bccf;
      line-height: 1.6;
    }

    #popup-close {
      background: none;
      border: 1px solid var(--line);
      color: white;
      border-radius: 999px;
      padding: 6px 16px;
      font: inherit;
      cursor: pointer;
    }

    /* ============================================================
       7. SMALL SCREENS: keep this last so it overrides the rules above
       ============================================================ */
    @media (max-width: 800px) {
      main {
        margin-left: 0;
        padding: 140px 16px 80px;
      }
    }
  </style>
</head>

<body>

  <!-- Site title, top-left -->
  <header>
    <h1>My Universe</h1>
    <p>A personal site. Six sections, one per sphere.</p>
  </header>

  <!-- Menu, bottom-left. Buttons are created by JavaScript from SECTIONS -->
  <nav></nav>

  <!-- Content panel. Hidden on the home view; filled in by openSection() -->
  <main hidden>
    <button class="back">← back</button>
    <h2 id="section-title"></h2>
    <p id="section-blurb"></p>
    <div class="grid" id="cards"></div>
  </main>

  <!-- Card popup. Opened by openPopup() -->
  <dialog id="popup">
    <img id="popup-img" alt="">
    <div class="popup-body">
      <h3 id="popup-title"></h3>
      <p id="popup-note"></p>
      <button id="popup-close">close</button>
    </div>
  </dialog>

  <!-- Tell the browser where to download three.js from -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from "three";

    // ==============================================================
    // 1. CONTENT: edit this to change the site
    // ==============================================================
    // Each section becomes a menu button AND a sphere.
    //   radius: sphere size (keep them nested: largest first)
    //   items:  cards in the panel. Either plain text, or
    //           { title, image, note } for a poster with a popup.
    const SECTIONS = [
      { name: "about",    radius: 3.2, color: "#7dd3fc", blurb: "loading...", items: [] },
      { name: "projects", radius: 2.2, color: "#a78bfa", blurb: "beepboop",   items: [] },
      { name: "notes",    radius: 1.5, color: "#f472b6", blurb: "brrr",       items: [] },
      { name: "sports",   radius: 1.0, color: "#fbbf24", blurb: "aesthetic",  items: [] },
      {
        name: "anime", radius: 0.6, color: "#34d399", blurb: "Shows I love.",
        items: [
          { title: "Frieren",                     image: "images/frieren.jpg", note: "beyond journey's end" },
          { title: "Mob Psycho 100",              image: "images/mob-psycho-100.jpg" },
          { title: "Cowboy Bebop",                image: "images/cowboy-bebop.jpg" },
          { title: "Mushishi",                    image: "images/mushishi.jpg" },
          { title: "Ping Pong the Animation",     image: "images/ping-pong-the-animation.jpg" },
          { title: "Vinland Saga",                image: "images/vinland-saga.jpg" },
          { title: "Made in Abyss",               image: "images/made-in-abyss.jpg" },
          { title: "Showa Genroku Rakugo Shinju", image: "images/showa-genroku-rakugo-shinju.jpg" },
          { title: "Orb",                         image: "images/orb.jpg" },
          { title: "Attack on Titan",             image: "images/attack-on-titan.jpg" },
        ],
      },
      { name: "movies",   radius: 0.3, color: "#f87171", blurb: "Movies I love.", items: [] },
    ];

    // ==============================================================
    // 2. SETTINGS: tuning knobs for the 3D scene
    // ==============================================================
    const HOME_DISTANCE   = 10;    // how far back the camera sits on the home view
    const CAMERA_EASE     = 3;     // higher = camera arrives faster
    const RING_RADIUS     = 4;     // orbit rings, just outside the biggest sphere
    const DOTS_PER_RING   = 100;
    const RING_TILTS      = [0, 30, 60, 120, 150];   // degrees (90 skipped: it would be a flat line)
    const SPARK_COUNT     = 150;
    const SPARK_TRAVEL    = 0.6;   // how far sparks fly before restarting
    const DRAG_SPEED      = 0.005; // radians of spin per pixel dragged
    const CLICK_TOLERANCE = 5;     // pixels of movement before a press counts as a drag

    // Elements the 3D code should ignore clicks and hovers on
    const UI_ELEMENTS = "button, .card, dialog";

    // ==============================================================
    // 3. STATE: things that change while the page runs
    // ==============================================================
    let current = null;            // the open section (null = home view)
    let hovered = null;            // the section under the mouse (null = none)
    const mouse = { x: 0, y: 0 };  // mouse position, -1 to 1 on each axis
    const spin  = { x: 0, y: 0 };  // extra rotation added by dragging
    let dragging = false;
    let dragMoved = 0;             // pixels moved during the current press

    // ==============================================================
    // 4. PAGE ELEMENTS: looked up once and reused
    // ==============================================================
    const nav       = document.querySelector("nav");
    const main      = document.querySelector("main");
    const titleEl   = document.querySelector("#section-title");
    const blurbEl   = document.querySelector("#section-blurb");
    const cardsEl   = document.querySelector("#cards");
    const popup     = document.querySelector("#popup");
    const popupImg  = document.querySelector("#popup-img");
    const popupTitle = document.querySelector("#popup-title");
    const popupNote = document.querySelector("#popup-note");

    // ==============================================================
    // 5. CONTENT PANEL: open/close sections, build cards, popups
    // ==============================================================

    // Show a section in the panel (the camera flies there in the loop)
    function openSection(section) {
      current = section;
      main.hidden = false;
      titleEl.textContent = section.name;
      blurbEl.textContent = section.blurb;
      document.body.style.setProperty("--accent", section.color);

      cardsEl.replaceChildren();                       // clear the old cards
      section.items.forEach((raw, i) => cardsEl.appendChild(buildCard(raw, i)));

      // slide the panel in from the right
      main.animate(
        [{ opacity: 0, transform: "translateX(24px)" }, { opacity: 1, transform: "none" }],
        { duration: 600, easing: "ease-out" }
      );

      for (const s of SECTIONS) s.button.classList.toggle("active", s === section);
    }

    // Back to the home view
    function goHome() {
      current = null;
      main.hidden = true;
      for (const s of SECTIONS) s.button.classList.remove("active");
    }

    // Make one card. `raw` is plain text or a { title, image, note } object.
    // `index` sets the stagger delay so the cards cascade in.
    function buildCard(raw, index) {
      const item = typeof raw === "string" ? { title: raw } : raw;   // treat both shapes the same

      const card = document.createElement("div");
      card.className = "card";

      if (item.image) {
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.title;
        img.loading = "lazy";                          // download only when it's about to be visible
        card.appendChild(img);
      }

      const label = document.createElement("span");
      label.textContent = item.title;                  // textContent, never innerHTML (safe from XSS)
      card.appendChild(label);

      card.addEventListener("click", () => openPopup(item));

      // fade and rise into place, 50ms after the previous card
      card.animate(
        [{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }],
        { duration: 500, delay: 200 + index * 50, easing: "ease-out", fill: "backwards" }
      );
      return card;
    }

    // Show the popup for one card
    function openPopup(item) {
      popupTitle.textContent = item.title;
      popupNote.textContent = item.note ?? "";         // empty if there's no note
      popupImg.hidden = !item.image;
      if (item.image) {
        popupImg.src = item.image;
        popupImg.alt = item.title;
      }
      popup.showModal();
    }

    // Menu buttons: one per section, linked both ways so each can find the other
    for (const section of SECTIONS) {
      const button = document.createElement("button");
      button.textContent = section.name;
      button.section = section;
      section.button = button;
      button.addEventListener("click", () => openSection(section));
      nav.appendChild(button);
    }

    // Ways to close things
    document.querySelector(".back").addEventListener("click", goHome);
    document.querySelector("#popup-close").addEventListener("click", () => popup.close());
    popup.addEventListener("click", (e) => {
      if (e.target === popup) popup.close();           // clicked the dark area outside the popup
    });
    addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (popup.open) return;                          // the dialog closes itself on Escape
      goHome();
    });

    // ==============================================================
    // 6. 3D SETUP: scene, camera, renderer, lights
    // ==============================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      50,                                // field of view (degrees)
      innerWidth / innerHeight,          // aspect ratio
      0.1, 100                           // draw things between these distances
    );
    camera.position.z = HOME_DISTANCE;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });  // alpha: see-through background
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));   // sharp on retina, capped for speed
    renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(renderer.domElement);              // the <canvas>, behind the page

    scene.add(new THREE.AmbientLight("#ffffff", 0.6));       // soft light from everywhere
    const light = new THREE.PointLight("#ffffff", 1.5, 0, 0); // a bulb with infinite range, no fade
    light.position.set(10, 10, 10);
    scene.add(light);

    // Everything that spins lives in `world`, so one rotation moves it all
    const world = new THREE.Group();
    scene.add(world);

    // ==============================================================
    // 7. 3D OBJECTS: spheres, orbit rings, sparks
    // ==============================================================

    // --- Spheres: a soft glow shell + a wireframe, one pair per section
    for (const section of SECTIONS) {
      const segments = Math.round(12 + section.radius * 8);   // fewer lines on small spheres

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(section.radius, 64, 64),
        new THREE.MeshStandardMaterial({
          color: section.color,
          emissive: section.color,       // glows on its own
          emissiveIntensity: 0.4,
          transparent: true,
          opacity: 0.06,
          side: THREE.DoubleSide,        // visible from inside too (the camera flies in)
          depthWrite: false,             // let inner spheres show through outer ones
        })
      );
      const wire = new THREE.Mesh(
        new THREE.SphereGeometry(section.radius, segments, segments),
        new THREE.MeshBasicMaterial({
          color: section.color, wireframe: true, transparent: true, opacity: 0.25, depthWrite: false,
        })
      );
      glow.renderOrder = wire.renderOrder = -section.radius;  // draw big spheres first

      world.add(glow, wire);
      section.glow = glow;               // keep references for the animation loop
      section.wire = wire;
      section.offset = Math.random() * 10;   // so they don't all breathe in sync
    }

    // --- A soft round dot, drawn once on a 2D canvas, used by rings and sparks
    function makeDotTexture() {
      const size = 64;
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0,   "rgba(255,255,255,1)");   // solid center
      grad.addColorStop(0.3, "rgba(255,255,255,0.8)");
      grad.addColorStop(1,   "rgba(255,255,255,0)");   // transparent edge
      g.fillStyle = grad;
      g.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }
    const dotTexture = makeDotTexture();

    // --- Orbit rings: one circle of dots, reused at 5 tilts
    const ringPositions = new Float32Array(DOTS_PER_RING * 3);   // x,y,z for each dot
    for (let i = 0; i < DOTS_PER_RING; i++) {
      const angle = (i / DOTS_PER_RING) * Math.PI * 2;
      ringPositions[i * 3]     = RING_RADIUS * Math.cos(angle);
      ringPositions[i * 3 + 1] = RING_RADIUS * Math.sin(angle);
      ringPositions[i * 3 + 2] = 0;
    }
    const ringGeometry = new THREE.BufferGeometry();
    ringGeometry.setAttribute("position", new THREE.BufferAttribute(ringPositions, 3));

    // Each ring is drawn twice on the same spot (big & faint + small & bright) = a cheap glow
    const haloDot = new THREE.PointsMaterial({ size: 0.3,  map: dotTexture, color: "#ffffff", transparent: true, opacity: 0.15, depthWrite: false });
    const coreDot = new THREE.PointsMaterial({ size: 0.08, map: dotTexture, color: "#ffffff", transparent: true, opacity: 0.9,  depthWrite: false });

    const rings = RING_TILTS.map((degrees, i) => {
      const ring = new THREE.Group();
      ring.add(new THREE.Points(ringGeometry, haloDot));
      ring.add(new THREE.Points(ringGeometry, coreDot));
      ring.rotation.x = THREE.MathUtils.degToRad(degrees);
      ring.userData.speed = 0.1 + 0.02 * i;            // each ring a little faster
      world.add(ring);
      return ring;
    });

    // --- Sparks: particles that fly out of the hovered sphere
    const sparkData = [];
    for (let i = 0; i < SPARK_COUNT; i++) {
      const theta = Math.random() * Math.PI * 2;        // around the equator
      const phi = Math.acos(2 * Math.random() - 1);     // from the pole (this formula spreads them evenly)
      sparkData.push({
        dir: new THREE.Vector3().setFromSphericalCoords(1, phi, theta),   // direction, length 1
        speed: 0.1 + 0.1 * Math.random(),
        offset: Math.random() * 100,                   // so they don't all start together
      });
    }
    const sparkPositions = new Float32Array(SPARK_COUNT * 3);
    const sparkGeometry = new THREE.BufferGeometry();
    sparkGeometry.setAttribute("position", new THREE.BufferAttribute(sparkPositions, 3));
    const sparks = new THREE.Points(sparkGeometry, new THREE.PointsMaterial({
      size: 0.12, map: dotTexture, transparent: true, opacity: 0.9, depthWrite: false,
      blending: THREE.AdditiveBlending,                // overlaps get brighter, like light
    }));
    sparks.frustumCulled = false;                      // they move after creation, so never skip drawing them
    world.add(sparks);

    // ==============================================================
    // 8. MOUSE: hover, click, and drag-to-spin
    // ==============================================================
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const center = new THREE.Vector3(0, 0, 0);
    const smallestFirst = [...SECTIONS].sort((a, b) => a.radius - b.radius);

    // Which sphere is under the mouse? Measure how close the mouse ray passes to
    // the center, then pick the smallest sphere that's at least that big.
    function sectionAt(event) {
      pointer.x = (event.clientX / innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const distance = raycaster.ray.distanceToPoint(center);
      return smallestFirst.find((s) => s.radius >= distance) ?? null;
    }

    addEventListener("pointerdown", (e) => {
      if (e.target.closest(UI_ELEMENTS)) return;
      dragging = true;
      dragMoved = 0;
    });

    addEventListener("pointerup", () => {
      dragging = false;
    });

    addEventListener("pointermove", (e) => {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / innerHeight) * 2 + 1;

      if (dragging) {
        spin.y += e.movementX * DRAG_SPEED;
        spin.x += e.movementY * DRAG_SPEED;
        dragMoved += Math.abs(e.movementX) + Math.abs(e.movementY);
      }

      const navButton = e.target.closest("nav button");
      if (navButton) hovered = navButton.section;      // hovering the menu lights up its sphere
      else if (e.target.closest(UI_ELEMENTS)) hovered = null;
      else hovered = sectionAt(e);

      document.body.style.cursor = hovered ? "pointer" : "";
    });

    addEventListener("click", (e) => {
      if (e.target.closest(UI_ELEMENTS)) return;
      if (dragMoved > CLICK_TOLERANCE) return;         // that was a drag, not a click
      const clicked = sectionAt(e);
      if (!clicked || clicked === current) goHome();   // empty space or the open sphere → home
      else openSection(clicked);
    });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ==============================================================
    // 9. ANIMATION: one small function per job, called every frame
    // ==============================================================

    // Slow breathing, plus a white pulse on the hovered sphere
    function animateSpheres(t) {
      for (const s of SECTIONS) {
        const breathe = 1 + 0.008 * Math.sin(2 * t + s.offset);
        s.glow.scale.setScalar(breathe);
        s.wire.scale.setScalar(breathe);

        const hot = s === hovered;
        s.wire.material.color.set(hot ? "#ffffff" : s.color);
        s.wire.material.opacity = hot ? 0.9 : 0.25;
        s.glow.material.opacity = hot ? 0.15 : 0.06;
        s.glow.material.emissiveIntensity = hot ? 1.5 + 0.3 * Math.sin(10 * t) : 0.4;
      }
    }

    // Spin each ring in its own tilted plane
    function animateRings(t) {
      for (const ring of rings) ring.rotation.z = t * ring.userData.speed;
    }

    // Sparks fly out SPARK_TRAVEL units, then restart at the surface (the % trick)
    function animateSparks(t) {
      sparks.visible = hovered !== null;
      if (!hovered) return;

      sparks.material.color.set(hovered.color);
      for (let i = 0; i < SPARK_COUNT; i++) {
        const p = sparkData[i];
        const distance = hovered.radius + ((t * p.speed + p.offset) % SPARK_TRAVEL);
        sparkPositions[i * 3]     = p.dir.x * distance;
        sparkPositions[i * 3 + 1] = p.dir.y * distance;
        sparkPositions[i * 3 + 2] = p.dir.z * distance;
      }
      sparkGeometry.attributes.position.needsUpdate = true;   // send the new positions to the GPU
    }

    // Glide the camera toward its goal: the open sphere, or home
    const cameraGoal = new THREE.Vector3(0, 0, HOME_DISTANCE);   // where the camera wants to be
    const lookGoal = new THREE.Vector3();                         // where it wants to look
    const look = new THREE.Vector3();                             // where it's looking now

    function animateCamera(dt) {
      if (current) {
        // Close enough to frame the sphere, shifted so it sits in the left half
        const distance = current.radius * 3.2 + 1.5;
        const halfWidth = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * distance * camera.aspect;
        const shift = camera.aspect > 1 ? halfWidth * 0.5 : 0;  // phones: no shift
        cameraGoal.set(shift, 0, distance);
        lookGoal.set(shift, 0, 0);
      } else {
        // Home: centered, leaning slightly toward the mouse
        cameraGoal.set(0, 0, HOME_DISTANCE);
        lookGoal.set(mouse.x * 0.5, mouse.y * 0.5, 0);
      }

      // Move a fraction of the remaining distance each frame: fast when far, gentle on arrival.
      // Based on elapsed time, so it feels the same at 60Hz or 120Hz.
      const k = 1 - Math.exp(-CAMERA_EASE * dt);
      camera.position.lerp(cameraGoal, k);
      look.lerp(lookGoal, k);
      camera.lookAt(look);
    }

    // The main loop: update everything, draw, repeat before the next screen refresh
    const clock = new THREE.Clock();
    function loop() {
      const dt = clock.getDelta();       // seconds since the last frame
      const t = clock.elapsedTime;       // seconds since the start

      world.rotation.y = 0.1 * t + spin.y;
      world.rotation.x = 0.05 * t + spin.x;
      animateSpheres(t);
      animateRings(t);
      animateSparks(t);
      animateCamera(dt);

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    // ==============================================================
    // 10. START: everything above exists now, so begin animating
    // ==============================================================
    loop();
  </script>
